<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单词意象</title>
<style>
:root{--bg:#eef3f4;--card:#fbfdfd;--ink:#12303d;--mute:#5f7882;--line:#cfdcdf;--acc:#0b7a86;--accbg:#dff0f1;--lost:#8a3b2a;--lostbg:#f8e9e4;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1c23;--card:#142830;--ink:#e3eef0;--mute:#8fa8b0;--line:#26414b;--acc:#52c3cf;--accbg:#173a42;--lost:#f0a794;--lostbg:#3a2420}}
:root[data-theme="dark"]{--bg:#0d1c23;--card:#142830;--ink:#e3eef0;--mute:#8fa8b0;--line:#26414b;--acc:#52c3cf;--accbg:#173a42;--lost:#f0a794;--lostbg:#3a2420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px}
.ask{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;border:0;border-radius:10px;padding:0 18px;background:var(--acc);color:var(--bg);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc);padding:6px 14px}
button.del{background:transparent;color:var(--mute);padding:4px 8px;font-weight:400}
.mute{color:var(--mute)}
#out{margin-top:20px}
details{margin:0 0 12px;font-size:14px;color:var(--mute)}
summary{cursor:pointer;padding:4px 0}
details label{display:block;margin-top:8px}
details input{font-size:15px;padding:8px 10px;width:100%;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.word{font-size:28px;font-weight:700;margin:0 0 4px}
.pic{font:600 22px/1.55 "Songti SC","Noto Serif SC","Source Han Serif SC",serif;color:var(--acc);margin:6px 0 18px}
.sec{border-left:3px solid var(--line);padding-left:12px;margin:14px 0}
.sec b{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:2px}
.sec ul{margin:0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--accbg);color:var(--acc);padding:2px 10px;border-radius:99px;font-size:15px}
.sec.lost{border-color:var(--lost);background:var(--lostbg);border-radius:0 8px 8px 0;padding:8px 12px}
.sec.lost b{color:var(--lost)}
.ex{font-style:italic}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
#bank{margin-top:8px}
.sg{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:0;border-radius:0;padding:10px 12px;font-weight:400;margin:0}
.sg:first-child{border-top:1px solid var(--line);border-radius:10px 10px 0 0}
.sg:last-child{border-radius:0 0 10px 10px}
.sg:only-child{border-radius:10px}
.sg strong{flex:none}
.sg span{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0;text-align:left;background:none;color:var(--ink);font-weight:400;padding:10px 0}
.item .t strong{margin-right:8px}
.item .t span{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main>
<h1>输入单词，看它本来的画面</h1>
<div class="ask">
<input id="w" type="text" placeholder="比如 cling" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
<button id="go">解释</button>
</div>
<div id="out"></div>
<section id="bank"></section>
<p id="cnt" class="mute" style="font-size:13px;margin-top:32px"></p>
</main>
<script>
let D=[];
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function sec(l,c){const s=el('div','sec'+(c?' '+c:''));s.appendChild(el('b','',l));return s}
function card(d){
  const c=el('div','card');
  c.appendChild(el('p','word',d.w));
  c.appendChild(el('p','pic',d.i));
  const s1=sec('由这个画面引申出的意思'),ul=el('ul');
  d.s.forEach(x=>ul.appendChild(el('li','',x)));s1.appendChild(ul);c.appendChild(s1);
  const s2=sec('平时常被翻成'),ch=el('div','chips');
  d.c.forEach(x=>ch.appendChild(el('span','',x)));s2.appendChild(ch);c.appendChild(s2);
  const s3=sec('这样翻丢掉了什么','lost');s3.appendChild(el('div','',d.l));c.appendChild(s3);
  const s4=sec('例句');s4.appendChild(el('div','ex',d.e[0]));s4.appendChild(el('div','mute',d.e[1]));c.appendChild(s4);
  return c;
}
function showCard(d){$('w').value=d.w;$('bank').replaceChildren();$('out').replaceChildren(card(d));$('w').blur()}
function find(q){q=q.trim().toLowerCase();return q?D.filter(d=>d.w.startsWith(q)).slice(0,8):[]}
function suggest(){
  const q=$('w').value.trim(),b=$('bank');b.replaceChildren();
  if(!q)return;
  const r=find(q);
  if(!r.length){b.appendChild(el('p','mute','还没收录“'+q+'”，词库在不断增加。'));return}
  r.forEach(d=>{const x=el('button','sg');x.appendChild(el('strong','',d.w));x.appendChild(el('span','',d.i));x.onclick=()=>showCard(d);b.appendChild(x)});
}
function ask(){
  const q=$('w').value.trim().toLowerCase();
  const hit=D.find(d=>d.w===q)||find(q)[0];
  if(hit)showCard(hit);else suggest();
}
$('go').onclick=ask;
$('w').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
$('w').addEventListener('input',()=>{$('out').replaceChildren();suggest()});
$('cnt').textContent='词库加载中…';
fetch('words.json').then(r=>r.json()).then(d=>{D=d;$('cnt').textContent='已收录 '+D.length+' 个词，释义由 AI 生成，仅供参考。';if($('w').value.trim())suggest()}).catch(()=>{$('cnt').textContent='词库加载失败，请刷新页面重试。'});
</script>
</body>
</html>
